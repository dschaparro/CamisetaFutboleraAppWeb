<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="fondo" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#1B3A66"/>
      <stop offset="1" stop-color="#0A1626"/>
    </radialGradient>
    <linearGradient id="blanco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D5DEEE"/>
    </linearGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="circulo"><circle cx="60" cy="60" r="53"/></clipPath>
  </defs>

  <!-- Insignia -->
  <circle cx="60" cy="60" r="57" fill="#1E6BFF"/>
  <circle cx="60" cy="60" r="53" fill="url(#fondo)"/>

  <g clip-path="url(#circulo)">
    <!-- Camiseta en gancho (sin marcas) -->
    <g transform="translate(-4 -6)">
      <path d="M93 36a3.2 3.2 0 1 1 3.2 3.2v2.6" fill="none" stroke="#8FA1C4" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M84 47l12.2-4.4 12.2 4.4 6.6 12-6.4 3.4-3.2-5.4V84H87.6V57l-3.2 5.4-6.4-3.4z" fill="#0E1D36" stroke="#1E6BFF" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M87.6 61h17.2M87.6 65.5h17.2" stroke="#1E6BFF" stroke-width="1.4" opacity=".7"/>
      <path d="M91.5 43.3q4.7 4 9.4 0" fill="none" stroke="#1E6BFF" stroke-width="1.8"/>
    </g>

    <!-- Cuerpo -->
    <path d="M36 112c0-18 10.8-30 24-30s24 12 24 30z" fill="url(#blanco)"/>
    <!-- Cuello -->
    <rect x="54" y="72" width="12" height="9" rx="3" fill="#0A1626"/>

    <!-- Cabeza -->
    <rect x="31" y="22" width="58" height="50" rx="22" fill="url(#blanco)"/>
    <rect x="37" y="30" width="46" height="34" rx="15" fill="#0A1626"/>
    <!-- Ojos sonrientes -->
    <g fill="none" stroke="#4FC3FF" stroke-width="3.6" stroke-linecap="round" filter="url(#brillo)">
      <path d="M44.5 49q5.5-7 11 0"/>
      <path d="M64.5 49q5.5-7 11 0"/>
    </g>

    <!-- Audífonos con micrófono -->
    <path d="M30 46a30 30 0 0 1 60 0" fill="none" stroke="#1E6BFF" stroke-width="3.4" stroke-linecap="round"/>
    <rect x="23.5" y="38" width="11" height="20" rx="5.5" fill="#1E6BFF"/>
    <rect x="85.5" y="38" width="11" height="20" rx="5.5" fill="#1E6BFF"/>
    <path d="M91 56q0 13-15 14" fill="none" stroke="#1E6BFF" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="70" y="67" width="8" height="5" rx="2.5" fill="#4FC3FF" filter="url(#brillo)"/>

    <!-- Balón -->
    <g transform="translate(31 86)">
      <circle r="13.5" fill="#FFFFFF" stroke="#0A1626" stroke-width="1.4"/>
      <path d="M0-5.2l5 3.6-1.9 5.9h-6.2L-5-1.6z" fill="#0A1626"/>
      <path d="M0-5.2v-8M5-1.6l7.6-2.6M3.1 4.3l4.6 6.4M-3.1 4.3l-4.6 6.4M-5-1.6l-7.6-2.6" stroke="#0A1626" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M-4.2-12.8L0-13.4l4.2.6L0-9.8z M12.4-4.6l.9 4.5-2.4 3.7-1.6-4.6z M7.9 10.6l-4 2.3-4.3-.4 3.7-3.1z M-7.9 10.6l4 2.3 4.3-.4-3.7-3.1z M-12.4-4.6l-.9 4.5 2.4 3.7 1.6-4.6z" fill="#0A1626"/>
    </g>

    <!-- Tableta con carrito -->
    <rect x="48" y="84" width="30" height="24" rx="5" fill="#13294B" stroke="#1E6BFF" stroke-width="2"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M53.5 89.5h3l2.6 10.5h11l2.4-7.5H57.6"/>
    </g>
    <circle cx="60.5" cy="103.5" r="1.7" fill="#FFFFFF"/>
    <circle cx="68.5" cy="103.5" r="1.7" fill="#FFFFFF"/>
    <!-- Mano -->
    <ellipse cx="47" cy="101" rx="6" ry="5" fill="url(#blanco)"/>
  </g>
</svg>
